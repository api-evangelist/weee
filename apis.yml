aid: weee
name: Weee
description: >-
  Weee! is America's largest online Asian grocery store and delivery platform,
  operating as a direct-to-consumer online supermarket serving major
  metropolitan areas across the United States. It curates and fulfills inventory
  through regional distribution centers and cold-chain logistics, bringing
  together products and ingredients commonly found in Chinese, Japanese, Korean,
  Vietnamese, Thai, Filipino, and Indian supermarkets. The storefront spans fresh
  produce, frozen meats, seafood, pantry staples, snacks, sauces, hot pot
  ingredients, beverages, and household essentials, accepts EBT/SNAP in eligible
  cities, and runs a multilingual experience (English, Chinese, Korean, Japanese,
  Vietnamese, Thai). Weee is backed by Lightspeed Venture Partners and the SoftBank
  Vision Fund. As of this profile Weee publishes no public developer API; this
  record captures its public web identity and AI-indexing (llms.txt) surface.
